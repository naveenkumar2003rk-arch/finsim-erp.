<title>FinSim ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>/* FinSim ERP – enterprise shell: navy shell bar, cool neutral canvas, white object pages */
:root {
  --bg: #EDF1F5; --surface: #FFFFFF; --surface-2: #F5F7FA; --line: #D7DEE7; --line-2: #E7ECF1;
  --text: #17212B; --muted: #5A6878; --accent: #0B5CAD; --accent-h: #094C8F; --accent-soft: #E2EDF9; --on-accent: #FFFFFF;
  --shell: #10243E; --shell-2: #183354; --shell-text: #E6EDF5; --shell-muted: #9FB3CB;
  --good: #1B7543; --good-soft: #E1F2E8; --warn: #9A5800; --warn-soft: #FCF0DA; --crit: #B42318; --crit-soft: #FCE7E5; --info: #0B5CAD; --info-soft: #E2EDF9; --neutral-soft: #ECEFF3;
  --s1: #0B5CAD; --s2: #D48A2C; --s3: #A7B4C3; --shadow: 0 1px 2px rgba(16, 36, 62, .06), 0 2px 8px rgba(16, 36, 62, .05);
  --f-ui: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D141C; --surface: #151F2A; --surface-2: #1A2633; --line: #2A3848; --line-2: #223040; --text: #E3E9F0; --muted: #94A3B5; --accent: #5BA3EE; --accent-h: #7AB6F3; --accent-soft: #19304C; --on-accent: #0B1622;
  --shell: #09121D; --shell-2: #13243A; --shell-text: #E3EAF2; --shell-muted: #8EA3BB;
  --good: #5BC28A; --good-soft: #15322A; --warn: #E7A748; --warn-soft: #382A14; --crit: #F07A70; --crit-soft: #3B1C1B; --info: #5BA3EE; --info-soft: #19304C; --neutral-soft: #213042;
  --s1: #5BA3EE; --s2: #E0A04A; --s3: #5B6C80; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D141C; --surface: #151F2A; --surface-2: #1A2633; --line: #2A3848; --line-2: #223040; --text: #E3E9F0; --muted: #94A3B5; --accent: #5BA3EE; --accent-h: #7AB6F3; --accent-soft: #19304C; --on-accent: #0B1622;
  --shell: #09121D; --shell-2: #13243A; --shell-text: #E3EAF2; --shell-muted: #8EA3BB;
  --good: #5BC28A; --good-soft: #15322A; --warn: #E7A748; --warn-soft: #382A14; --crit: #F07A70; --crit-soft: #3B1C1B; --info: #5BA3EE; --info-soft: #19304C; --neutral-soft: #213042;
  --s1: #5BA3EE; --s2: #E0A04A; --s3: #5B6C80; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--f-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--shell); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0 0 8px; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.num, td.r, .kpi-v { font-variant-numeric: tabular-nums; }
.num { white-space: nowrap; }
.neg { color: var(--crit); }
.ok { color: var(--good); } .bad { color: var(--crit); } .warnc { color: var(--warn); font-weight: 600; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 11.5px; }
.r { text-align: right; }
.row { display: flex; align-items: center; } .wrap { flex-wrap: wrap; } .gap-s { gap: 8px; } .gap-m { gap: 14px; }
.clip { display: inline-block; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }

/* ---------- Shell ---------- */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 16px; background: var(--shell); color: var(--shell-text); border-bottom: 1px solid var(--shell-2); }
.burger { display: none; background: none; border: 0; color: var(--shell-text); padding: 6px; border-radius: 4px; cursor: pointer; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--shell-text); text-decoration: none; flex: none; }
.logo { width: 30px; height: 30px; border-radius: 5px; background: linear-gradient(135deg, #2E7BD0, #0B4F96); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .5px; }
.brand b { display: block; font-size: 15px; letter-spacing: .2px; } .brand i { display: block; font-style: normal; font-size: 10.5px; color: var(--shell-muted); }
.cc-chip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--shell-muted); border-left: 1px solid var(--shell-2); padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cc-chip span { background: var(--shell-2); color: var(--shell-text); padding: 2px 6px; border-radius: 3px; font-family: var(--f-mono); font-size: 11.5px; }
.gsearch { position: relative; flex: 1; max-width: 460px; min-width: 120px; display: flex; align-items: center; gap: 8px; background: var(--shell-2); border-radius: 18px; padding: 0 12px; height: 34px; color: var(--shell-muted); margin-left: auto; }
.gsearch input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--shell-text); font-size: 13px; }
.gsearch input::placeholder { color: var(--shell-muted); }
.gs-res { position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 28px rgba(0, 0, 0, .18); max-height: 420px; overflow: auto; z-index: 70; }
.gs-res button { display: flex; gap: 10px; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; cursor: pointer; border-bottom: 1px solid var(--line-2); }
.gs-res button:hover { background: var(--accent-soft); }
.gs-res b { display: block; font-size: 13px; } .gs-res i { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
.gs-k { flex: none; width: 78px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding-top: 2px; }
.top-r { display: flex; align-items: center; gap: 14px; flex: none; }
.bdate { display: grid; line-height: 1.15; text-align: right; font-size: 12px; }
.bdate span, .role-sw span { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--shell-muted); }
.bdate i { font-style: normal; font-size: 10.5px; color: var(--shell-muted); }
.role-sw { display: grid; line-height: 1.1; }
.role-sw select { background: var(--shell-2); color: var(--shell-text); border: 1px solid #2B4A70; border-radius: 4px; font-size: 12.5px; padding: 3px 4px; max-width: 210px; }
.iconbtn { position: relative; background: none; border: 0; color: var(--shell-text); padding: 6px; border-radius: 50%; cursor: pointer; display: grid; }
.iconbtn:hover { background: var(--shell-2); }
.dotc { position: absolute; top: 0; right: -2px; background: #E5484D; color: #fff; font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }
.notif { position: relative; }
.notif-p { position: absolute; right: 0; top: 42px; width: min(380px, 92vw); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 32px rgba(0, 0, 0, .2); padding: 10px; z-index: 70; display: grid; gap: 6px; max-height: 70vh; overflow: auto; }
.notif-i { text-align: left; border: 1px solid var(--line-2); background: var(--surface); border-radius: 5px; padding: 8px 10px; cursor: pointer; display: grid; gap: 3px; font-size: 13px; border-left: 3px solid var(--line); }
.notif-i.unread { background: var(--surface-2); font-weight: 500; } .notif-i.warn { border-left-color: var(--warn); } .notif-i.crit { border-left-color: var(--crit); } .notif-i.good { border-left-color: var(--good); } .notif-i.info { border-left-color: var(--accent); }
.notif-i i { font-style: normal; font-size: 11px; color: var(--muted); }
.avatar { position: relative; width: 32px; height: 32px; border-radius: 50%; border: 0; background: #2E7BD0; color: #fff; font-weight: 600; font-size: 12px; cursor: pointer; }
.unsaved { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); border: 2px solid var(--shell); }
.body { display: flex; flex: 1; min-height: 0; }
.side { width: 238px; flex: none; position: sticky; top: calc(54px + env(safe-area-inset-top, 0px)); height: calc(100vh - 54px - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 10px 8px 16px max(8px, env(safe-area-inset-left, 0px)); }
.side-g { margin-bottom: 10px; }
.side-gl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); padding: 8px 10px 4px; font-weight: 600; }
.side-i { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 5px; color: var(--text); text-decoration: none; font-size: 13.5px; position: relative; }
.side-i:hover { background: var(--surface-2); }
.side-i.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-i.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--accent); }
.side-i span:first-of-type { flex: 1; min-width: 0; }
.side-b { background: var(--warn); color: #fff; font-size: 11px; border-radius: 9px; padding: 0 6px; min-width: 18px; text-align: center; font-weight: 600; }
.side-b.soft { background: var(--accent-soft); color: var(--accent); }
.side-foot { padding: 12px 10px 0; border-top: 1px solid var(--line-2); margin-top: 6px; }
.side-scrim { display: none; }
.main { flex: 1; min-width: 0; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1320px; margin: 0 auto; display: grid; gap: 14px; }
.page > * { min-width: 0; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding-bottom: 4px; }
.page-h h1 { font-size: 22px; font-weight: 600; letter-spacing: -.2px; }
.page-h p { margin: 2px 0 0; font-size: 13px; }
.page-ic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.crumbs { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.crumbs a { text-decoration: none; }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.card-h h3 { font-size: 15px; font-weight: 600; } .card-h p { margin: 2px 0 0; }
.card-b { padding: 14px 16px; }
.card .card { box-shadow: none; background: var(--surface-2); margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.col { display: grid; gap: 14px; min-width: 0; }
.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-top: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 500; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-h); color: var(--on-accent); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn-danger { color: var(--crit); border-color: var(--crit); background: var(--surface); }
.btn-danger:hover:not(:disabled) { background: var(--crit-soft); color: var(--crit); border-color: var(--crit); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
label.btn { cursor: pointer; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 4px; display: grid; }
.x:hover { background: var(--neutral-soft); color: var(--text); }
.x:disabled { opacity: .3; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; margin-left: 4px; vertical-align: middle; }
.pill:first-child { margin-left: 0; }
.pill-good { background: var(--good-soft); color: var(--good); } .pill-warn { background: var(--warn-soft); color: var(--warn); } .pill-crit { background: var(--crit-soft); color: var(--crit); }
.pill-info { background: var(--info-soft); color: var(--info); } .pill-neutral { background: var(--neutral-soft); color: var(--muted); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r); border: 1px solid; font-size: 13.5px; margin: 6px 0; }
.alert b { display: block; margin-bottom: 2px; } .alert ul { margin: 4px 0 0; padding-left: 18px; }
.alert-info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.alert-good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.alert-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.alert-crit { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.alert > .ic { margin-top: 2px; }
.alert-info > .ic { color: var(--info); } .alert-good > .ic { color: var(--good); } .alert-warn > .ic { color: var(--warn); } .alert-crit > .ic { color: var(--crit); }
.banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--shell); color: var(--shell-text); border-radius: var(--r); font-size: 13.5px; }
.banner .pill { margin: 0; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpi { text-align: left; display: grid; gap: 2px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); border-top: 3px solid var(--line); box-shadow: var(--shadow); color: var(--text); min-width: 0; }
.kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--accent); }
.kpi:disabled { opacity: 1; }
.kpi-l { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.kpi-v { font-size: 20px; font-weight: 600; letter-spacing: -.2px; overflow-wrap: anywhere; }
.kpi-s { font-size: 12px; color: var(--muted); }
.kpi-good { border-top-color: var(--good); } .kpi-warn { border-top-color: var(--warn); } .kpi-crit { border-top-color: var(--crit); }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { background: none; border: 0; padding: 9px 14px; font-size: 13.5px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
.tab:hover { color: var(--text); } .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-b { margin-left: 6px; background: var(--warn); color: #fff; border-radius: 8px; padding: 0 6px; font-size: 11px; }

/* Forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 14px; margin-bottom: 12px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: span 2; }
.field-l { font-size: 12px; font-weight: 600; color: var(--muted); }
.field-h { font-size: 11.5px; color: var(--muted); }
.req { color: var(--crit); font-style: normal; margin-left: 2px; }
.inp { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--text); font-size: 13.5px; min-width: 0; }
textarea.inp { height: auto; padding: 8px 10px; resize: vertical; }
select.inp { padding-right: 4px; }
.inp:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
.inp.r { text-align: right; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.form-actions { margin-top: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 10px 16px; border-bottom: 1px solid var(--line-2); }
.filters .inp { width: auto; min-width: 150px; max-width: 280px; }
.filters .field { width: 170px; }
.calc { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 12px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 5px; margin: 10px 0; font-size: 13.5px; }
.sub-h { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 14px 0 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.seg.big button { padding: 8px 14px; font-size: 13px; }

/* Tables */
.tblw { min-width: 0; }
.tbl-tools { display: flex; gap: 10px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
.srch { display: flex; align-items: center; gap: 6px; position: relative; color: var(--muted); }
.srch .inp { width: 220px; padding-left: 8px; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); background: var(--surface-2); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.tbl.dense td, .tbl.dense th { padding: 5px 8px; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--accent-soft); }
.tbl tr.selrow td { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
.tbl tr.resolved td { background: color-mix(in srgb, var(--good-soft) 60%, transparent); }
.tbl tr.warnrow td { background: var(--crit-soft); }
.tbl tr.okrow td:first-child { box-shadow: inset 3px 0 var(--good); } .tbl tr.partrow td:first-child { box-shadow: inset 3px 0 var(--warn); } .tbl tr.badrow td:first-child { box-shadow: inset 3px 0 var(--crit); }
.tbl tfoot td { background: var(--surface-2); font-weight: 500; border-top: 1px solid var(--line); }
.tbl .sel { width: 34px; }
.th-b { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.th-b:hover { color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 22px !important; }
.tbl-pg { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.card-b .tbl-tools, .card-b .tbl-pg { padding-left: 0; padding-right: 0; }
.stmt td { padding: 7px 10px; } .stmt tr.tot td { font-weight: 600; border-top: 1px solid var(--line); background: var(--surface-2); } .stmt tr.grand td { border-top: 2px solid var(--text); }
.stmt tr.sec-row td { padding-top: 14px; border-bottom: 0; }

/* Modal & toasts */
.modal-bg { position: fixed; inset: 0; background: rgba(9, 18, 29, .48); z-index: 90; display: grid; place-items: start center; padding: max(24px, env(safe-area-inset-top, 0px)) 12px 24px; overflow-y: auto; }
.modal { width: min(640px, 100%); background: var(--surface); border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.modal.wide { width: min(980px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h2 { font-size: 16px; font-weight: 600; }
.modal-b { padding: 16px 18px; overflow-y: auto; min-height: 0; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 100; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); }

/* Launchpad */

5",title:"Review vendor outstanding \u2013 Kaveri Infotech statement",dept:"Accounts Payable (P2P)",priority:"Medium",deadline:"04.11.2026",level:"Intermediate",app:"ap",appParams:{tab:"recon"},scenario:"Kaveri Infotech emailed their statement of account as of 31.10 and is asking why we \u201Cowe\u201D them over \u20B910 lakh. Their sales manager is threatening to stop supplies.",data:e=>[{title:"Statement from Kaveri Infotech (as of 31.10.2026)",cols:[["ref","Their invoice"],["date","Date",je],["amount","Amount",be],["note","Note"]],rows:e.vendorStatements.V100002.lines},{title:"Our vendor ledger \u2013 Kaveri open items",cols:[["invNo","Invoice"],["invDate","Date",je],["payable","Payable",be],["status","Status"]],rows:e.vinv.filter(t=>t.vendor==="V100002"&&t.invDate>="2026-09-01")}],deliverable:"Both balances, the reconciling items and the correct response to the vendor.",instructions:["AP \u2192 Vendor Reconciliation shows both sides.","Work out which items exist on only one side and why.","Answer and submit."],hints:["Check when KIS/26-27/1102 was paid.","Do we have a PO and goods receipt for KIS/26-27/1201?"],questions:[{id:"ours",type:"number",prompt:"Balance per our books (\u20B9)",answer:677792,tol:1,weight:15,skill:"Reconciliation",explain:"KIS/1187 \u20B93,02,080 (blocked) + KIS/1195 \u20B93,75,712 = \u20B96,77,792."},{id:"theirs",type:"number",prompt:"Balance per vendor statement (\u20B9)",answer:1074744,tol:1,weight:15,skill:"Reconciliation",explain:"Sum of the four lines on their statement."},{id:"why",type:"multi",prompt:"Which items explain the difference?",options:[["pay","KIS/1102 \u20B93,75,712 \u2013 we paid on 30.10, vendor has not applied it yet"],["inv","KIS/1201 \u20B921,240 \u2013 invoice not received / not booked by us"],["blk","KIS/1187 \u2013 blocked invoice"],["dup","A duplicate invoice in our books"]],answer:["pay","inv"],weight:30,skill:"Investigation",explain:"\u20B93,75,712 + \u20B921,240 = \u20B93,96,952 = the full difference. KIS/1187 is on both sides, so it is not a difference (although it is a reason we have not paid it)."},{id:"resp",type:"choice",prompt:"What do you do about KIS/26-27/1201?",options:[["req","Ask Kaveri for a copy invoice and check for a PO and goods receipt before booking"],["book","Book it straight from the statement so balances agree"],["ign","Ignore it \u2013 not our problem"],["pay","Pay it today to keep supplies running"]],answer:"req",weight:25,skill:"Workflow compliance",explain:"Never post an invoice from a statement line. No PO/GR = no proof the goods were ordered or received."},{id:"txt",type:"text",prompt:"Write two lines you would email to Kaveri.",keywords:[["paid","payment","utr","30.10"],["1201","copy","invoice"],["1187","block","variance","credit note","price"]],weight:15,skill:"Investigation",model:"KIS/1102 was paid on 30.10 (UTR HDFCN26103051877) \u2013 please apply it. Please send a copy of KIS/1201 with the delivery challan; KIS/1187 is on hold due to price \u20B912,800 vs PO \u20B912,500 and 2 units short \u2013 please issue a credit note."}],explanation:"Vendor statements rarely agree with our ledger on the same day. The usual causes are payments in transit, invoices the vendor sent that we have not received or booked, disputed/blocked invoices, and credit notes not yet issued. A reconciliation lists them so both sides can fix their part.",realWorld:"AP teams reconcile statements for top vendors monthly or quarterly. The reply quotes payment UTRs, requests missing documents, and explains holds \u2013 it keeps the relationship good without paying anything that is not verified.",concept:{label:"Vendor reconciliation",lesson:"I1"}},{id:"T06",title:"Identify overdue customer receivables",dept:"Accounts Receivable (O2C)",priority:"Medium",deadline:"Today 16:00",level:"Beginner",app:"ar",appParams:{tab:"aging"},scenario:"The CFO wants a list of every customer invoice more than 30 days past its due date before the weekly cash meeting.",data:e=>[{title:"Open customer invoices (as of 02.11.2026)",cols:[["cust","Customer"],["invNo","Invoice"],["invDate","Inv. date",je],["dueDate","Due",je],["open","Open",be]],rows:e.cinv.filter(t=>t.kind==="INV"&&!["Cleared","Reversed"].includes(t.status)&&t.dueDate<"2026-11-02").map(t=>({...t,cust:e.customers.find(c=>c.id===t.customer).name,open:he(t)}))}],deliverable:"The list of >30-day overdue items, their total, and the right follow-up.",instructions:["Days overdue = business date (02.11.2026) \u2212 due date.","Select only items over 30 days.","Check whether any of them was actually paid but not applied."],hints:["Tejas July invoice was due 11.08.2026.","Look at the suspense account for a Konark receipt."],questions:[{id:"sel",type:"multi",prompt:"Select every invoice more than 30 days overdue",options:e=>[["tj",`Tejas ${Ze(e,"tejasJul").invNo}`],["ta",`Tejas ${Ze(e,"tejasAug").invNo}`],["kj",`Konark ${Ze(e,"konarkJul").invNo} (residual)`],["me",`Meridian ${Ze(e,"meridianAug").invNo}`],["ar",`Aranya ${Ze(e,"aranyaSep").invNo}`]],answer:["tj","ta","kj"],weight:35,skill:"Reporting",explain:"Tejas Jul (83 days), Konark Jul (64 days) and Tejas Aug (52 days). Meridian is 18 days late and Aranya 3 days."},{id:"tot",type:"number",prompt:"Total open amount over 30 days (\u20B9)",answer:919220,tol:1,weight:25,skill:"Accounting accuracy",explain:"\u20B94,53,710 + \u20B94,53,710 + \u20B911,800 = \u20B99,19,220."},{id:"ko",type:"choice",prompt:"Konark\u2019s \u20B911,800 residual \u2013 best next step",options:[["susp","Check suspense: an unidentified \u20B911,800 receipt of 14.09 matches \u2013 apply it"],["dun","Send a final dunning notice"],["wo","Write it off"],["ign","Ignore \u2013 it is small"]],answer:"susp",weight:20,skill:"Investigation",explain:"Dunning a customer who already paid damages the relationship. Always check unapplied cash first."},{id:"lvl",type:"choice",prompt:"Dunning level for the Tejas July invoice",options:[["1","Level 1 \u2013 friendly reminder"],["2","Level 2 \u2013 second reminder"],["3","Level 3 \u2013 final notice and credit hold"]],answer:"3",weight:20,skill:"Workflow compliance",explain:"Over 45 days overdue \u2192 level 3 under NavFin\u2019s dunning procedure."}],explanation:"Aging groups receivables by days past due. Items over 30 days need active collection. Before chasing a customer, the collector checks for unapplied cash (suspense, payments on account) so the list is accurate.",realWorld:"Collectors prepare the overdue list from FBL5N/aging, call customers in order of amount and age, log promises-to-pay, and escalate repeat offenders to credit management (credit block).",concept:{label:"Customer aging and dunning",lesson:"I3"}},{id:"T07",title:"Correct a wrong G/L posting through the approved workflow",dept:"General Ledger (R2R)",priority:"Medium",deadline:"03.11.2026",level:"Intermediate",app:"gl",appParams:{tab:"post"},scenario:"During review, Rohit found that Swift Travels\u2019 September invoice (client travel for the Sales team, \u20B976,000 before GST) was booked to Office Supplies 591000 instead of Travel & Conveyance 530000. The invoice is already paid.",data:e=>[{title:"Original document",cols:[["acct","Account"],["dc","Dr/Cr"],["amt","Amount",be],["cc","Cost ctr"],["text","Text"]],rows:(e.docs.find(t=>t.docNo===e._refs.swiftSep)||{lines:[]}).lines}],deliverable:"A reclassification entry posted (or submitted for approval) and the reasoning.",instructions:["Display the original document","Decide whether to reverse it or reclassify.","Post the reclass journal entry in GL with a reference to the original document.","Answer and submit."],hints:["Reversing a paid invoice is blocked \u2013 you would first have to reverse the payment.","Move the cost: debit the right account, credit the wrong one, same cost center."],questions:[{id:"how",type:"choice",prompt:"Best way to correct it?",options:[["reclass","Reclassification journal entry (wrong account \u2192 right account)"],["rev","Reverse the invoice and its payment, then re-enter"],["edit","Edit the account on the posted document"],["none","Leave it \u2013 both are expenses"]],answer:"reclass",weight:20,skill:"Workflow compliance",explain:"Posted documents cannot be edited. Reversing paid items is disruptive. A reclass moves the amount cleanly with an audit trail."},{id:"je",type:"je",prompt:"Reclassification entry lines",answer:[{acct:"530000",dc:"D",amt:76e3},{acct:"591000",dc:"C",amt:76e3}],weight:30,skill:"Debit & credit",explain:"Debit the correct expense, credit the wrong one, both with CC2000."},{id:"act",type:"action",prompt:"Post (or submit) the reclass entry in the system.",weight:35,skill:"Transaction processing",check:e=>{let t=mt(e,c=>Te(c,"530000","D",76e3)&&Te(c,"591000","C",76e3));return t?{ok:!0,got:`${t.docNo} (${t.status})${t.ref?"":" \u2013 no reference given"}`,partial:!t.ref}:{ok:!1,got:"No reclass document found"}},explain:""},{id:"pl",type:"choice",prompt:"Does this correction change profit?",options:[["no","No \u2013 both accounts are P&L expenses; only the split changes"],["up","Yes \u2013 profit goes up"],["down","Yes \u2013 profit goes down"]],answer:"no",weight:15,skill:"Accounting accuracy",explain:"Total expenses are unchanged; travel goes up, supplies go down."}],explanation:"Errors are corrected by new postings, never by changing history. A reclassification is a journal entry that moves an amount from the wrong account to the right one. Because it changes reported numbers, it is reviewed by a second person.",realWorld:"The analyst prepares the reclass with the original document number as reference and a clear text, attaches the invoice copy, and the manager approves. A root-cause note goes to AP (wrong default account in their template).",concept:{label:"Corrections, reversals and reclasses",lesson:"B3"}},{id:"T08",title:"Prepare the trial balance as of 31.10.2026",dept:"Financial Reporting",priority:"Medium",deadline:"04.11.2026",level:"Beginner",app:"reports",appParams:{tab:"tb"},scenario:"Rohit needs the October trial balance for the close review meeting and wants you to point out balances that look wrong.",data:()=>[],deliverable:"Trial balance totals, key balances and review comments.",instructions:["Financial Reports \u2192 Trial Balance, period 01.10.2026 \u2013 31.10.2026.","Read the totals and scan for unusual balances.","Answer using the current figures in the system."],hints:["Closing debit total = closing credit total.","An asset account with a credit balance is unusual."],questions:[{id:"tot",type:"number",prompt:"Total of closing DEBIT balances at 31.10.2026 (\u20B9)",answer:e=>ct(e,"2026-10-31").totDr,tol:1,weight:25,skill:"Reporting",explain:"Taken from the trial balance as it stands now in the system."},{id:"hdfc",type:"number",prompt:"HDFC bank G/L 110000 balance at 31.10.2026 (\u20B9)",answer:e=>se(e,"110000","2026-10-31"),tol:1,weight:20,skill:"Reporting",explain:"Per the bank ledger now."},{id:"mean",type:"choice",prompt:"If the trial balance balances, are the books correct?",options:[["no","Not necessarily \u2013 wrong accounts or missing entries still balance"],["yes","Yes \u2013 equal totals prove there are no errors"]],answer:"no",weight:20,skill:"Accounting accuracy",explain:"A balanced TB proves only that debits equal credits."},{id:"flag",type:"multi",prompt:"Which balances need investigation?",options:[["susp","Suspense 199999 has a balance"],["grir","GR/IR 201000 has a debit balance"],["acc","Accumulated depreciation 169000 has a credit balance"],["gst","Output GST 210000 has a credit balance"]],answer:["susp","grir"],weight:35,skill:"Investigation",explain:"Suspense should be zero; a GR/IR debit means we were invoiced for more than we received. Credit balances on accumulated depreciation and output GST are normal."}],explanation:"The trial balance lists every account\u2019s closing balance. Equal totals are a basic check. The real value is review: each balance should make sense for its account type, and anything unexpected is investigated before statements are issued.",realWorld:"R2R analysts export the TB, compare with the prior month, and write short comments on big movements and unusual balances. The controller signs off before the P&L and balance sheet go to management.",concept:{label:"Trial balance",lesson:"B4"}},{id:"T09",title:"Investigate and clear the suspense account",dept:"General Ledger (R2R)",priority:"High",deadline:"04.11.2026",level:"Advanced",app:"gl",appParams:{tab:"ledger",acct:"199999"},scenario:"Audit policy: the suspense account must be zero at every month end. It currently holds two receipts that AR could not identify.",data:e=>[{title:"Suspense 199999 line items",cols:[["postDate","Date",je],["docNo","Document"],["ref","Bank ref"],["htext","Text"],["signed","Dr+ / Cr\u2212",be]],rows:pe(e,{acct:"199999"})},{title:"Konark Insurance Brokers \u2013 July invoice",cols:[["invNo","Invoice"],["gross","Gross",be],["paid","Paid",be],["open","Open",be]],rows:[{...Ze(e,"konarkJul"),open:he(Ze(e,"konarkJul"))}]}],deliverable:"Every suspense item identified, cleared to the right account, and suspense at zero for 31.10.",instructions:["Look at bank references and narrations (\u201CKIB\u201D = Konark Insurance Brokers).","Match each item to a customer open item.","Clear each one via AR \u2192 Incoming Payment with source \u201CSuspense account 199999\u201D, value date in October.","Answer and submit."],hints:["Task T03 handles the Meridian item.","Konark\u2019s July invoice has exactly \u20B911,800 left open."],questions:[{id:"items",type:"multi",prompt:"Which items make up the suspense balance before clean-up?",options:[["me","Meridian \u20B98,64,000 (18.10)"],["ko","Konark \u20B911,800 (14.09)"],["tj","Tejas UPI \u20B918,880 (25.10)"],["lo","Lotus \u20B9500 difference"]],answer:["me","ko"],weight:20,skill:"Investigation",explain:"Only items already posted to 199999 are in suspense. The Tejas UPI receipt is not in our books yet (it is a bank reconciliation break)."},{id:"ko",type:"choice",prompt:"Where does the \u20B911,800 belong?",options:[["kj","Residual of Konark July invoice"],["rev","Other income"],["ref","Refund from a vendor"]],answer:"kj",weight:20,skill:"Investigation",explain:"Konark paid \u20B92,24,200 of \u20B92,36,000 in August, then the \u20B911,800 balance in September."},{id:"je",type:"je",prompt:"Entry to clear the Konark item (use 120000 for the customer)",answer:[{acct:"199999",dc:"D",amt:11800},{acct:"120000",dc:"C",amt:11800}],weight:20,skill:"Debit & credit",explain:"Debit suspense to bring it to zero, credit the customer to close the invoice."},{id:"zero",type:"action",prompt:"Suspense balance at 31.10.2026 is zero.",weight:30,skill:"Transaction processing",check:e=>{let t=se(e,"199999","2026-10-31");return Math.abs(t)<.01?{ok:!0,got:"Balance \u20B90.00"}:{ok:!1,got:`Balance ${S(t)}`}},explain:""},{id:"why",type:"text",prompt:"In one or two sentences: why must suspense be cleared before closing?",keywords:[["unidentified","unknown","temporary","not identified"],["receivable","overstate","misstate","wrong","incorrect","customer"],["audit","auditor","control","fraud","risk"]],weight:10,skill:"Investigation",model:"Suspense holds unidentified items, so the real accounts (here, customer receivables) are misstated while it has a balance. Auditors treat an uncleared suspense as a control weakness and possible fraud risk."}],explanation:"Suspense is a holding place for items that cannot be identified immediately. Every item must be investigated and moved to its correct account. A month-end suspense balance means some account (often receivables) is wrong.",realWorld:"Analysts keep a suspense ageing list with owners. They use bank references, customer remittance emails and open-item lists to identify each item. Unresolved items over 30 days are escalated.",concept:{label:"Suspense account investigation",lesson:"A2"}},{id:"T10",title:"Perform October month-end closing entries",dept:"Financial Close",priority:"Critical",deadline:"04.11.2026",level:"Intermediate",app:"closing",appParams:{},scenario:"The close calendar assigns you three October entries: depreciation run, prepaid insurance amortisation, and an accrual for October electricity (the bill arrives on 8 November).",data:()=>[{title:"Electricity bills (KUPSC)",cols:[["b","Bill"],["v","Amount",be]],rows:[{b:"Aug bill (Jul usage)",v:64500},{b:"Sep bill (Aug usage)",v:63900},{b:"Oct bill (Sep usage)",v:66600}]},{title:"Policy",cols:[["k","Rule"],["v","Detail"]],rows:[{k:"Accrual estimate",v:"Average of last three bills, auto-reverse 01.11"},{k:"Insurance",v:"\u20B92,40,000 annual premium, 1/12 per month"}]}],deliverable:"Three posted October documents.",instructions:["Asset Accounting \u2192 Depreciation Run \u2192 period 7 \u2192 Post.","Month-End Close \u2192 Accruals & Prepaids \u2192 prepare and post both entries (posting date 31.10.2026).","Answer and submit."],hints:["(64,500 + 63,900 + 66,600) \xF7 3","Accrual: 521000 Dr / 220000 Cr."],questions:[{id:"amt",type:"number",prompt:"Electricity accrual amount (\u20B9)",answer:65e3,tol:1,weight:15,skill:"Accounting accuracy",explain:"\u20B91,95,000 \xF7 3 = \u20B965,000."},{id:"dep",type:"action",prompt:"October depreciation posted",weight:25,skill:"Transaction processing",check:e=>{let t=e.docs.find(c=>c.type==="AF"&&c.period===7&&c.status==="Posted"&&!c.reversedBy);return t?{ok:!0,got:`${t.docNo}`}:{ok:!1,got:"Not posted"}}},{id:"pre",type:"action",prompt:"Prepaid insurance amortised for October",weight:20,skill:"Transaction processing",check:e=>{let t=mt(e,c=>c.period===7&&Te(c,"565000","D",2e4)&&Te(c,"140000","C",2e4),["Posted"]);return t?{ok:!0,got:t.docNo}:{ok:!1,got:"Not found in period 7"}}},{id:"acc",type:"action",prompt:"Electricity accrual posted in October with auto-reversal",weight:25,skill:"Transaction processing",check:e=>{let t=mt(e,a=>a.period===7&&Te(a,"521000","D")&&Te(a,"220000","C"),["Posted"]);if(!t)return{ok:!1,got:"Not found in period 7"};let c=Te(t,"521000","D",65e3);return{ok:c&&t.autoRev,partial:!(c&&t.autoRev),got:`${t.docNo}${c?"":" \u2013 amount not \u20B965,000"}${t.autoRev?"":" \u2013 no auto-reversal"}`}}},{id:"why",type:"choice",prompt:"Why is the accrual auto-reversed on 01.11?",options:[["dbl","So the real bill booked in November does not double-count the cost"],["tax","To reduce tax"],["cash","To pay the bill early"]],answer:"dbl",weight:15,skill:"Accounting accuracy",explain:"The reversal cancels the estimate; the actual invoice then carries the true amount."}],explanation:"The accrual principle says expenses belong to the period in which they are incurred. Month-end entries make sure October carries its share of depreciation, insurance and utilities even when no invoice or payment happened in October.",realWorld:"Close teams follow a calendar (Day 1: accruals, Day 2: depreciation and reconciliations, Day 3: review). Each entry has a standard template, supporting calculation and reviewer.",concept:{label:"Accruals, prepaids and depreciation in the close",lesson:"I7"}},{id:"T11",title:"Verify Kaveri invoice against PO and goods receipt",dept:"Procure to Pay",priority:"High",deadline:"Today 17:00",level:"Intermediate",app:"mm",appParams:{tab:"blocked"},scenario:"Invoice KIS/26-27/1187 from Kaveri Infotech is blocked for payment. Kaveri says it is \u201Curgent\u201D.",data:e=>{let t=e.pos.find(c=>c.id===e._refs.poM);return[{title:`Purchase order ${t.id}`,cols:[["m","Item"],["qty","Ordered"],["price","PO price",be]],rows:t.items.map(c=>({...c,m:"27-inch IPS monitor"}))},{title:"Goods receipt",cols:[["id","GRN"],["date","Date",je],["q","Qty received"],["note","Remark"]],rows:e.grs.filter(c=>c.po===t.id).map(c=>({...c,q:T(c.items,a=>a.qty)}))},{title:"Vendor invoice",cols:[["k","Field"],["v","Value"]],rows:[{k:"Invoice",v:"KIS/26-27/1187 dated 20.10.2026"},{k:"Lines",v:'20 \xD7 27" monitor @ \u20B912,800'},{k:"Total incl. GST 18%",v:"\u20B93,02,080"}]}]},deliverable:"Variances quantified and the right resolution chosen.",instructions:["Compare quantity: invoiced vs received.","Compare price: invoiced vs PO.","Choose how to resolve \u2013 do not release without a reason."],hints:["20 invoiced, 18 received.","Price difference per unit = \u20B9300."],questions:[{id:"q",type:"number",prompt:"Quantity variance (units invoiced but not received)",answer:2,tol:0,weight:20,skill:"Reconciliation",explain:"20 \u2212 18 = 2."},{id:"p",type:"number",prompt:"Price variance in \u20B9 (before GST) on the invoiced quantity",answer:6e3,tol:1,weight:25,skill:"Accounting accuracy",explain:"(\u20B912,800 \u2212 \u20B912,500) \xD7 20 = \u20B96,000."},{id:"res",type:"choice",prompt:"Correct resolution",options:[["cn","Keep the block; ask for a credit note for the price difference and wait for (or get credit for) the 2 missing units"],["rel","Release for payment \u2013 the vendor is reliable"],["po","Change the PO price to \u20B912,800 yourself"],["rej","Reverse the PO"]],answer:"cn",weight:30,skill:"Workflow compliance",explain:"We pay only for what we ordered at the agreed price and actually received."},{id:"pay",type:"number",prompt:"Correct amount payable incl. GST if the price is corrected and the 2 units arrive (\u20B9)",answer:295e3,tol:1,weight:25,skill:"Accounting accuracy",explain:"20 \xD7 \u20B912,500 = \u20B92,50,000 + 18% GST = \u20B92,95,000."}],explanation:"Three-way match protects the company from paying for goods not received or at prices not agreed. When it fails, the invoice is blocked automatically and someone must resolve the cause \u2013 not just override the block.",realWorld:"AP raises a dispute with the vendor and purchasing. Usually the vendor issues a credit note for the price, the warehouse posts the remaining receipt, and the system releases the invoice automatically (MRBR).",concept:{label:"Three-way match",lesson:"I1"}},{id:"T12",title:"Review a depreciation posting",dept:"Fixed Assets",priority:"Low",deadline:"05.11.2026",level:"Intermediate",app:"assets",a vables\u201D.","Accounts belong to five families: Assets (what we own), Liabilities (what we owe), Equity (owners\u2019 money), Income and Expenses.","The accounting equation always holds: Assets = Liabilities + Equity (+ Income \u2212 Expenses during the year).","In SAP the list of accounts is the Chart of Accounts. NavFin uses 1xxxxx for assets, 2 for liabilities, 3 for equity, 4 for income and 5 for expenses."],example:"NavFin pays \u20B93,54,000 rent. Expenses go up (Office Rent) and an asset goes down (bank) \u2013 the equation still balances.",terms:["G/L Account","Chart of Accounts","Company Code"],tryIt:{app:"gl",params:{tab:"coa"},label:"Browse the chart of accounts"},quiz:[{q:"Trade payables (money owed to vendors) is a\u2026",o:["Asset","Liability","Expense"],a:1,why:"We owe it \u2013 a liability."},{q:"Which number range holds expenses at NavFin?",o:["1xxxxx","4xxxxx","5xxxxx"],a:2,why:"5 = expenses."}]},{id:"B2",level:"Beginner",title:"Debit and credit without fear",min:10,body:["Debit (Dr) = left side. Credit (Cr) = right side. They are not \u201Cgood\u201D or \u201Cbad\u201D.","Assets and expenses INCREASE with a debit and decrease with a credit.","Liabilities, equity and income INCREASE with a credit and decrease with a debit.","Every journal entry has total debits = total credits. That is double entry.","Shortcut: ask \u201Cwhat did we get?\u201D (debit) and \u201Cwhere did it come from?\u201D (credit)."],example:"Office Rent Dr \u20B915,000 / HDFC Bank Cr \u20B915,000. We got the use of office space (expense \u2191, debit) and the money came from the bank (asset \u2193, credit).",terms:["Journal Entry","Document"],tryIt:{app:"gl",params:{tab:"post"},label:"Post your first journal entry"},quiz:[{q:"A customer pays us \u20B910,000. The bank account is\u2026",o:["Debited","Credited"],a:0,why:"Asset increases \u2192 debit."},{q:"Revenue from a sale is recorded as a\u2026",o:["Debit","Credit"],a:1,why:"Income increases with a credit."},{q:"Accumulated depreciation normally has a\u2026",o:["Debit balance","Credit balance"],a:1,why:"It is a contra-asset that reduces assets."}]},{id:"B3",level:"Beginner",title:"Documents, posting dates, parking and reversal",min:8,body:["Each posting in SAP creates a document with a unique number, a document type (SA, KR, DZ\u2026), a document date (date on the paper) and a posting date (decides the period).","Parking saves a document without changing balances \u2013 used when someone must review first.","Posted documents are never edited or deleted. To fix one you post a reversal (exact opposite) or a reclassification.","Posting period control decides which months are open. Closed months reject postings so reported numbers stay final."],example:"Swift Travels\u2019 invoice was booked to Office Supplies by mistake. The fix is a reclass: Travel Dr / Office Supplies Cr \u20B976,000 \u2013 the original stays visible for the auditor.",terms:["Document Type","Posting Date","Parking","Reversal","Posting Period Control"],tryIt:{app:"gl",params:{tab:"docs"},label:"Open the document journal"},quiz:[{q:"Which date decides the fiscal period?",o:["Document date","Posting date","Entry date"],a:1,why:"Posting date drives the period."},{q:"How do you correct a posted document?",o:["Edit it","Delete it","Reverse or reclassify it"],a:2,why:"History is never changed."}]},{id:"B4",level:"Beginner",title:"Ledgers and the trial balance",min:7,body:["A ledger shows every posting to one account with a running balance.","The trial balance lists the closing balance of every account. Total debit balances must equal total credit balances.","A balanced trial balance does not prove the books are right \u2013 wrong accounts and missing entries still balance.","Reviewers look for odd balances: suspense not zero, assets with credit balances, large GR/IR."],example:"Suspense 199999 with a credit balance of \u20B98,75,800 at month end is a red flag \u2013 money received but not applied to customers.",terms:["Trial Balance","Suspense Account"],tryIt:{app:"reports",params:{tab:"tb"},label:"Open the trial balance"},quiz:[{q:"If the trial balance balances, the books are error-free.",o:["True","False"],a:1,why:"Errors of principle and omission still balance."}]},{id:"B5",level:"Beginner",title:"Accounts payable and receivable basics",min:9,body:["Vendors are suppliers we owe; customers are buyers who owe us.","In SAP you post to the vendor or customer (subledger). A reconciliation account in the G/L (200000 / 120000) updates automatically.","Each invoice is an open item until a payment clears it.","Payment terms give the due date: invoice date + days. \u201C2% 10, net 30\u201D means 2% discount if paid within 10 days.","In India, GST is added on invoices and TDS may be deducted on payments."],example:"Rent invoice \u20B93,00,000 + GST \u20B954,000 \u2212 TDS 10% \u20B930,000 \u2192 we pay the landlord \u20B93,24,000 and the government \u20B930,000.",terms:["Vendor","Customer","Reconciliation Account","Open Item","Clearing","Payment Terms","GST","TDS"],tryIt:{app:"ap",params:{tab:"create"},label:"Enter a vendor invoice"},quiz:[{q:"Where is a vendor invoice posted in SAP?",o:["Directly to 200000","To the vendor account \u2013 200000 updates automatically"],a:1,why:"Reconciliation accounts cannot be posted directly."},{q:"TDS on a \u20B91,00,000 professional fee (10%) is\u2026",o:["\u20B910,000 on the amount before GST","\u20B911,800 on the amount with GST"],a:0,why:"TDS is on the value before GST."}]},{id:"B6",level:"Beginner",title:"Simple bank reconciliation",min:9,body:["Our bank G/L account and the bank statement should tell the same story \u2013 but on any day they differ.","Timing differences: cheques we issued that are not yet presented; deposits not yet credited.","Missing in books: bank charges, interest, receipts we did not record, returned payments.","Bank errors: the bank posted something wrong (e.g. debited twice).","A Bank Reconciliation Statement (BRS) adjusts both balances to the same figure."],example:"Bank shows \u20B99,43,815; books show \u20B910,23,570. Add deposits in transit, deduct unpresented cheques, adjust for charges and errors \u2192 both reconcile.",terms:["Bank Reconciliation","BRS","Timing Difference","House Bank"],tryIt:{app:"bank",params:{tab:"import"},label:"Import the October statement"},quiz:[{q:"A cheque we issued on 28.10 has not reached the bank. This is\u2026",o:["A bank error","A timing difference","Missing in books"],a:1,why:"Correct on both sides, just not yet processed."}]},{id:"I1",level:"Intermediate",title:"Vendor invoice processing, three-way match and duplicates",min:12,body:["Invoices with a PO go through MIRO: the system compares PO price, goods receipt quantity and invoice.","If quantity invoiced > quantity received, or price differs beyond tolerance, the invoice is blocked for payment.","Duplicate invoices are the most common AP leakage. Check vendor + normalised invoice number + date + amount.","Vendor statements should be reconciled regularly. Differences: payments in transit, invoices not received, disputes."],example:"Kaveri invoiced 20 monitors at \u20B912,800; PO says \u20B912,500 and only 18 arrived \u2192 blocked. Ask for a credit note, wait for 2 units.",terms:["Three-Way Match","GR/IR","Invoice Verification","Payment Block","MIRO","FB60"],tryIt:{app:"mm",params:{tab:"blocked"},label:"Review the blocked invoice"},quiz:[{q:"GR/IR with a debit balance usually means\u2026",o:["Invoices exceed goods received","Goods received but not invoiced"],a:0,why:"Invoice receipt debits GR/IR; goods receipt credits it."}]},{id:"I2",level:"Intermediate",title:"Payment runs and payment controls",min:8,body:["A payment run (F110) selects due invoices, proposes payments, and after approval creates payment documents and bank files.","Review the proposal: blocked invoices, duplicates, vendors with bank changes, cash discounts.","Maker-checker: the person who proposes cannot approve the run."],example:"Proposal PR-0300 contained both Deccan invoices \u2013 the checker must reject it.",terms:["F110","Cash Discount","Maker-Checker","Segregation of Duties"],tryIt:{app:"ap",params:{tab:"pay"},label:"Create a payment proposal"},quiz:[{q:"Who approves a payment run you prepared?",o:["You","A different authorised person"],a:1,why:"Segregation of duties."}]},{id:"I3",level:"Intermediate",title:"Customer collections, TDS and dunning",min:10,body:["Cash application = matching receipts to invoices. Use remittance advice, bank narration and amount.","Indian customers often deduct TDS (10% for professional services, 2% for contracts) from the pre-GST amount.","Unidentified receipts go to suspense temporarily \u2013 then must be applied.","Dunning sends reminders by level based on days overdue. Exclude items already paid or disputed."],example:"Meridian paid \u20B98,64,000 against \u20B99,44,000: 10% TDS on \u20B98,00,000 = \u20B980,000. Apply with a TDS line.",terms:["Dunning","Aging","F-28","TDS"],tryIt:{app:"ar",params:{tab:"pay"},label:"Apply an incoming payment"},quiz:[{q:"Customer pays \u20B91,08,000 on a \u20B91,18,000 invoice (\u20B91,00,000 + 18% GST). Most likely reason?",o:["TDS of 10% on the pre-GST amount (\u20B910,000)","Customer did not pay GST","Bank charges"],a:0,why:"10% \xD7 \u20B91,00,000 = \u20B910,000 \u2013 exactly the gap. Ask for the TDS certificate."}]},{id:"I4",level:"Intermediate",title:"Order to Cash and credit management",min:8,body:["Sales order \u2192 delivery (COGS Dr / Inventory Cr) \u2192 billing (Customer Dr / Revenue Cr / GST Cr) \u2192 payment.","Credit exposure = open receivables + open orders. Above the limit \u2192 credit block.","Releasing a credit block is a risk decision, usually for the Finance Manager."],example:"Tejas has \u20B99 lakh overdue; a new \u20B94.5 lakh order pushes exposure over \u20B910 lakh \u2192 blocked.",terms:["Sales Order","Delivery","Billing"],tryIt:{app:"sd",params:{},label:"Open Order to Cash"},quiz:[{q:"Which SD step posts revenue?",o:["Sales order","Goods issue","Billing"],a:2,why:"Revenue is recorded at billing."}]},{id:"I5",level:"Intermediate",title:"Cost centers, budgets and FI vs CO",min:10,body:["FI produces legal statements; CO gives managers a view by department, product or project.","Every expense line carries a cost center. In S/4HANA FI and CO share one Universal Journal.","Budget vs actual: variance = actual \u2212 budget; explain timing, volume, price and one-offs.","Allocations move shared costs (rent) to the departments that use them \u2013 FI totals stay the same."],example:"HR & Admin spent \u20B944 lakh vs a 7-month budget of \u20B942 lakh \u2013 mainly rent and electricity.",terms:["FI","CO","Cost Center","Profit Center","Universal Journal","Variance"],tryIt:{app:"co",params:{},label:"Explore Controlling"},quiz:[{q:"An assessment cycle changes the company\u2019s total expenses.",o:["True","False"],a:1,why:"It only moves costs between cost centers."}]},{id:"I6",level:"Intermediate",title:"Fixed assets and depreciation",min:8,body:["Capitalise items used for more than a year above the threshold.","SLM: cost \xF7 life. WDV: rate \xD7 opening NBV.","Monthly entry: Depreciation expense Dr / Accumulated depreciation Cr.","On disposal: remove cost and accumulated depreciation; sale \u2212 NBV = gain or loss."],example:"Laptops \u20B924 lakh / 36 months = \u20B966,667 per month.",terms:["Fixed Asset","Depreciation","SLM","WDV","Net Book Value"],tryIt:{app:"assets",params:{tab:"dep"},label:"Run depreciation"},quiz:[{q:"Depreciation reduces cash.",o:["True","False"],a:1,why:"It is a non-cash expense."}]},{id:"I7",level:"Intermediate",title:"Month-end close",min:10,body:["Close = making one month\u2019s numbers complete, correct and final.","Typical steps: cut-off of invoices, accruals, prepaid amortisation, depreciation, reconciliations (bank, subledgers, GR/IR, intercompany, suspense), review, period lock.","Accruals record expenses incurred without an invoice and are auto-reversed next month."],example:"October electricity estimated at \u20B965,000 (average of 3 bills) \u2013 accrued 31.10, reversed 01.11.",terms:["Month-End Close","Accrual","Prepaid Expense"],tryIt:{app:"closing",params:{},label:"Open the closing checklist"},quiz:[{q:"Why auto-reverse an accrual?",o:["To avoid double-counting when the real bill is posted","To delete it"],a:0,why:"The actual invoice replaces the estimate."}]},{id:"A1",level:"Advanced",title:"Intercompany transactions",min:8,body:["Group companies trade with each other; in consolidated accounts these balances must be eliminated.","Both sides must agree at month end. Timing (cut-off), FX and errors cause differences.","Fixes are made by the company that is wrong or late \u2013 not by plugging."],example:"NF01 shows \u20B916 lakh receivable from FZE; FZE confirms \u20B98 lakh \u2013 the 31.10 invoice is in transit.",terms:["Intercompany"],tryIt:{app:"ar",params:{tab:"ic"},label:"Intercompany reconciliation"},quiz:[{q:"An invoice in transit at month end should be fixed by\u2026",o:["The receiving company booking it","The sender reversing it"],a:0,why:"The invoice is valid."}]},{id:"A2",level:"Advanced",title:"Suspense account investigation",min:8,body:["Suspense is a temporary holding account. Each item needs an owner and a deadline.","Use bank reference, narration, amount and customer open items to identify receipts.","Clear by posting from suspense to the right account (often the customer)."],example:"\u201CNEFT CR KIB REF 220914\u201D \u20B911,800 = Konark Insurance Brokers paying the residual of its July invoice.",terms:["Suspense Account"],tryIt:{app:"gl",params:{tab:"ledger",acct:"199999"},label:"Open suspense ledger"},quiz:[{q:"An uncleared suspense balance at year end is acceptable if small.",o:["True","False"],a:1,why:"Auditors expect it explained and cleared."}]},{id:"A3",level:"Advanced",title:"Internal controls and audit trail",min:10,body:["Preventive controls stop errors (approval limits, duplicate checks, period locks). Detective controls find them (reconciliations, reviews).","Maker-checker and segregation of duties: one person cannot create and approve the same sensitive transaction.","Vendor bank changes must be verified independently \u2013 a top fraud route.","Every action leaves an audit trail: who, what, when."],example:"A bank-change email from a free-mail address must be rejected until verified by call-back.",terms:["Maker-Checker","Segregation of Duties","Audit Trail"],tryIt:{app:"approvals",params:{},label:"Open the approvals inbox"},quiz:[{q:"A bank reconciliation is a \u2026 control.",o:["Preventive","Detective"],a:1,why:"It detects differences after the fact."}]},{id:"A4",level:"Advanced",title:"Variance and flux analysis",min:8,body:["Compare periods line by line; investigate movements above a threshold.","Classify: missing entry, one-off, timing, volume, price.","Write explanations a manager can act on."],example:"October depreciation \u20B90 vs \u20B91.2 lakh in September \u2192 depreciation run not yet posted.",terms:["Variance"],tryIt:{app:"reports",params:{tab:"pl"},label:"Compare Oct vs Sep"},quiz:[{q:"A recurring cost dropping to zero most likely means\u2026",o:["A missing entry","Great cost savings"],a:0,why:"Investigate before celebrating."}]},{id:"A5",level:"Advanced",title:"Operational exception management",min:7,body:["Exceptions: failed payments, blocked invoices, credit blocks, unapplied cash.","Log each exception with owner, root cause and target date.","Fix the root cause, not just the symptom (e.g. tighten OCR duplicate rule)."],example:"Returned NEFT to Orbit \u2192 reverse payment, verify new bank details, re-pay in next run.",terms:["Payment Block"],tryIt:{app:"closing",params:{},label:"Log issues in the close tracker"},quiz:[{q:"After a returned payment you should first\u2026",o:["Re-pay to the same account","Reverse the payment and verify bank details"],a:1,why:"The account is closed."}]}],Lt=[["Basics","Explain the golden rules of accounting / debit and credit.","Assets and expenses increase with debits; liabilities, equity and income increase with credits. Every entry has equal debits and credits. Example: rent paid by bank \u2013 rent expense Dr, bank Cr."],["Basics","What is the difference between accrual and cash accounting?","Accrual records income when earned and expenses when incurred, regardless of cash. Cash basis records only when money moves. Companies in India follow accrual (Companies Act / Ind AS)."],["Basics","What is a trial balance and what are its limitations?","A list of all ledger balances where total debits = total credits. It does not catch errors of omission, principle (wrong account), compensating errors or wrong amounts entered on both sides."],["Basics","What is depreciation? SLM vs WDV?","Allocation of an asset\u2019s cost over its useful life. SLM charges the same amount each period; WDV charges a fixed rate on the declining book value, so more in early years."],["P2P","Walk me through Procure to Pay.","Requisition \u2192 PO \u2192 goods receipt (Inventory Dr / GR-IR Cr) \u2192 invoice verification with three-way match (GR-IR Dr, GST Dr / Vendor Cr) \u2192 payment run (Vendor Dr / Bank Cr) \u2192 vendor reconciliation."],["P2P","What is three-way matching and why is it important?","Comparing PO (price/qty ordered), goods receipt (qty received) and invoice (qty/price billed). It stops paying for goods not received or at unagreed prices; mismatches block the invoice."],["P2P","How do you detect and prevent duplicate invoices?","System check on vendor + invoice number + date + amount, normalising number formats; review payment proposals; monthly analytics on same amount/vendor; root-cause fixes (single invoice channel)."],["P2P","What is GR/IR and how do you clean it up?","A clearing account between goods receipt and invoice. Analyse open items by age: goods received not invoiced (chase invoices/accrue) and invoiced not received (chase GR or vendor credit). Old items are cleared with approval."],["P2P","How is TDS handled in AP?","Deducted at invoice/payment on the pre-GST amount per section (194C 1\u20132%, 194J 10%, 194I 10%), credited to TDS payable, deposited by the 7th of the next month, returns filed quarterly, Form 16A issued to vendors."],["O2C","Explain Order to Cash.","Sales order with credit check \u2192 delivery/PGI (COGS Dr / Inventory Cr) \u2192 billing (Customer Dr / Revenue & GST Cr) \u2192 collections/cash application (Bank Dr / Customer Cr) \u2192 dunning and aging."],["O2C","A customer paid less than the invoice. What do you do?","Check remittance advice: TDS deducted, bank charges, disputes, partial payment. Post the receipt with TDS/charges lines, leave a residual for genuine short-payment, follow up with the customer; never leave it unapplied."],["O2C","What is DSO and how would you reduce it?","Days Sales Outstanding = receivables \xF7 credit sales \xD7 days. Reduce by invoicing on time, clear terms, credit checks, regular dunning, fast dispute resolution and cash-application accuracy."],["R2R","What is a bank reconciliation? Name typical reconciling items.","Comparing bank statement to the bank ledger and explaining differences: unpresented cheques, deposits in transit, bank charges/interest not booked, returned payments, bank errors, our errors."],["R2R","What happens during month-end close?","Cut-off and accruals, prepaid amortisation, depreciation, reconciliations (bank, AP/AR, GR/IR, intercompany, suspense), flux review of TB and P&L, adjustments, period lock and reporting."],["R2R","What is an accrual and why is it reversed?","An expense (or income) recognised in the period it occurs before the invoice. It is auto-reversed next period so the actual invoice is not double-counted."],["R2R","What is a suspense account?","A temporary account for unidentified items. It must be investigated and cleared; a balance means some real account is misstated."],["R2R","How do you correct an error in a closed period?","You cannot post into a closed period; post the correction in the current open period (or reopen with manager approval if material), document the reason and impact."],["SAP","What is a company code, document type and posting key?","Company code = legal entity in SAP. Document type classifies postings (SA, KR, DZ\u2026) and controls number ranges. Posting keys define Dr/Cr and account type for each line (e.g. 40 G/L debit, 31 vendor credit)."],["SAP","Difference between FI and CO?","FI is external, legal reporting by G/L account. CO is internal management reporting by cost center, profit center and order. In S/4HANA both live in the Universal Journal."],["SAP","What is a reconciliation account?","A G/L account linked to a subledger (vendors/customers/assets) that updates automatically. You cannot post to it directly, so the subledger and G/L always agree."],["SAP","Name SAP T-codes you know for finance.","FB50 (G/L entry), FB60/MIRO (vendor invoice), F110 (payment run), FB70 (customer invoice), F-28 (incoming payment), FBL1N/FBL3N/FBL5N (line items), FF67/FEBAN (bank), AFAB (depreciation), OB52 (posting periods)."],["Controls","What is maker-checker / segregation of duties?","Different people prepare and approve sensitive transactions (payments, master data, JEs above a limit). It prevents both error and fraud. ERP enforces it through roles and workflow."],["Controls","A vendor emails new bank details. What do you do?","Do not update from the email. Verify by calling the vendor on the number in the master, get a signed letter on letterhead and cancelled cheque, have the change approved by a second person, and monitor the first payment."],["Behaviour","Tell me about a time you found an error. How did you handle it?","Use STAR: Situation, Task, Action, Result. E.g. \u201CWhile reconciling the bank I found the same electricity debit twice\u2026 I raised it with the bank, logged it on the BRS, and the bank reversed it in 3 days.\u201D"]];
